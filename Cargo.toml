[package]
name = "havn-channel-lark"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "havn channel adapter for Lark / Feishu — bridges the Lark IM API ↔ havn gateway WebSocket protocol (spec §3)."
repository = "https://github.com/amplimit/havn-channel-lark"
homepage = "https://github.com/amplimit/havn-channel-lark"
authors = ["Amplimit <oss@amplimit.com>"]

[[bin]]
name = "havn-channel-lark"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
# WS client to the havn gateway (reused verbatim from havn-channel-telegram).
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
# Outbound HTTP to the Lark Open API + resource downloads + STT multipart.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json", "query", "http2", "multipart", "stream"] }
# Inbound webhook HTTP server (Lark event subscription, spec choice: webhook).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
# Lark event-encryption (Encrypt Key): AES-256-CBC, key = SHA256(encrypt_key),
# IV = first 16 bytes of the base64-decoded payload, PKCS7 padding.
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
base64 = "0.22"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
